      const cheArr = (arr) => {
        if (!Array.isArray(arr)) {
          return "napaka: podan argument ni array";
        }

        if (arr.length === 0) {
          return "array je prazen";
        }

        return `array vsebuje: ${arr.length} elementov, ki so: ${arr.join(
          ", "
        )}`;
      };

      console.log(cheArr([]));
      console.log(cheArr([2]));
      console.log(cheArr(["abc"]));
      console.log(cheArr(["a","b","c"]));
