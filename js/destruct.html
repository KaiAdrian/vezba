<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // we have an array with a name and surname
      let arr = ["John", "Smith"];

      // destructuring assignment
      // sets firstName = arr[0]
      // and surname = arr[1]
      let [firstName, surname] = arr;

      console.log(`firstName: ${firstName}`); // John
      console.log(`surname: ${surname}`); // Smith

      //       “Destructuring” does not mean “destructive”.
      // It’s called “destructuring assignment,” because it “destructurizes” by copying items into variables. However, the array itself is not modified.

      // It’s just a shorter way to write:

      // // let [firstName, surname] = arr;
      // let firstName = arr[0];
      // let surname = arr[1];

      //         Works with any iterable on the right-side
      //   …Actually, we can use it with any iterable, not only arrays:

      let [a, b, c] = "abc"; // ["a", "b", "c"]
      let [one, two, three] = new Set([1, 2, 3]);
      console.log(``);
      console.log(`abc: ${"abc"}`);
      //   That works, because internally a destructuring assignment works by iterating
      //   over the right value. It’s a kind of syntax sugar
      //    for calling for..of over the value to the right of = and assigning the values.

      //       Assign to anything on the left-side
      // We can use any “assignables” on the left side.

      // For instance, an object property:

      let user = {};
      [user.name, user.surname] = "John Smith".split(" ");
      console.log(`user.name :${user.name}`); // John
      console.log(`user.surname:${user.surname}`); // Smith
      //   console.log(`user[1]:${user[1]}`);
      //   console.log(user[0]);

      // const cheArr = (arr) => arr.length;
      // Leva stran:
      // [user.name, user.surname]
      // pomeni:
      // prvi element arraya daj v user.name
      // drugi element arraya daj v user.surname
      // Torej po tem imaš objekt:

      // user = {
      //   name: "John",
      //   surname: "Smith"
      // }
      // Zakaj potem user[0] ne dela?
      // Ker user ni array, ampak objekt.
      // To pomeni:
      // user[0]
      // išče property z imenom "0".

      /* "",: */

      let user1 = {};
      [user1.name, user1.surname] = ["John", "Smith"];

      console.log("user1:", user1);
      // { name: "John", surname: "Smith" }

      console.log("user1.name:", user1.name); // John
      console.log("user1['name']:", user1["name"]); // John

      //for of..
      const arej = ["Joži", "Miška", "Medo"];
      for (const val of arej) {
        console.log(val);
      }
//       Za objekt:
// for...in za ključe

// ali Object.keys(), Object.values(), Object.entries()
// Primer:

const userIII = { name: "John", surname: "Smith" };

for (const key in userIII) {
  console.log("${key}: ${userIII[key]} \\vrne",`${key}: ${userIII[key]}`);
  console.log("${key}: \\ vrne",`${key}: `);
  console.log("${key}: \\ vrne",`:${key} `);
  console.log("${userIII[key]}:${key} \\ vrne",`${userIII[key]}:${key} `);

}
    </script>
  </body>
</html>
