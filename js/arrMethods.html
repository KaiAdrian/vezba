  <body>
    <script>
      // const enArej=letters=>
      const enArej = ["A", "a", "d", "69", "a"];
      const arrVChechNFilter = (arr, vZaZbrisi) => {
        const contains = arr.some((v) => v === vZaZbrisi);
        /* if (contains) {

                console.log("je");
                const newArr = arr.filter((val) => val !== vZaZbrisi);
                return newArr; // vrnemo NOV array
              } else {
                console.log("ni");
                return arr; // ali pa null, odvisno kaj želiš
              }*/

        // //         Bolj “čista” verzija (brez some())
        // // Ker filter() že sam po sebi pove ali je bil element prisoten
        // // (če se dolžina spremeni), lahko narediš elegantneje:
        const newArr = arr.filter((val) => val !== vZaZbrisi);

        if (newArr.length !== arr.length) {
          console.log("je");
          return newArr;
        } else {
          console.log("ni");
          return arr;
        }
      };

      console.log(
        "%c arrVChechNFilter(enArej, '4')",
        "color: green; font-weight: bold;",
        arrVChechNFilter(enArej, "4"),
        "//vrne originalni arr"
      );
      console.log(
        "%c arrVChechNFilter(enArej, 'A')",
        "color:red",
        arrVChechNFilter(enArej, "A"),
        "//odstrani 'A'"
      );
      /////

      // 🧠 Še bolj napredna verzija (z objektom rezultata)

      // Glede na to, da rad delaš bolj strukturirane stvari:

      const arrVChechNFilterObj = (arr, vZaZbrisi) => {
        const newArr = arr.filter((val) => val !== vZaZbrisi);

        return {
          found: newArr.length !== arr.length,
          array: newArr,
          msg:
            newArr.length !== arr.length
              ? `"${vZaZbrisi}" je bil izbrisan`
              : `"${vZaZbrisi}" ni v arrayu`,
        };
      };
      // const rezultat = arrVChechNFilterObj(enArej, "A");
      // console.log(rezultat.msg);
      // console.log(rezultat.array);

      const niVAreju = (arr, del) => arr.filter((rm) => rm !== del);
      console.log(niVAreju(enArej, "a"));

      const delFromArr = (arr, del) =>
        arr
          .map((v) => (v === del ? undefined : v))
          .filter((val) => val !== undefined);
      console.log(delFromArr(enArej, "a"));
      console.log(delFromArr(enArej, "69")); ///"A", "a","d"
      console.log(delFromArr(enArej, "d")); ///"A", "a","69"
      console.log(delFromArr(enArej, ""));

      ///uporaba some()
      const arrCheck = (arr, NVal) => arr.some((val) => val === NVal);
      console.log(arrCheck(enArej, 70)); //false
      console.log(arrCheck(enArej, "69")); //true
      console.log(arrCheck(enArej, "a")); //true
      console.log(arrCheck(enArej, "A")); //true
      console.log(arrCheck(enArej, "C")); //false
      /*
                  ///CONSOLE.LOGI////////////
            */
      // console.log("%c delFromArr(enArej, a)", "color: green; font-weight: bold;");
      console.trace("arrCheck(enArej,70" + " " + arrCheck(enArej, 70));
      console.log(
        "%c arrCheck(enArej,'a')",
        "color:white; background: blue; padding: 2px;",
        arrCheck(enArej, "a")
      );
      console.log(
        "%c niVAreju(enArej,'2')",
        "color: green; font-weight: bold;",
        niVAreju(enArej, "2")
      );
      console.log(
        "%c niVAreju(enArej,'a')",
        "color: red; font-weight: bolder;",
        niVAreju(enArej, "a")
      );
    </script>
