    <script>
      // const enArej=letters=>
      const enArej = ["A", "a", "d", "69", "a"];
      // const checkArej = (arr, del) => arr.some((val) => val === del);
      function jeNiVAreju(arr, vrednostZaIzbris) {
        const result = arr.some((v) => v === vrednostZaIzbris);
        if (result===true) {
          const nArr = arr.filter((rem) => rem !== del);
          return nArr;
        }
      }
      console.log(jeNiVAreju(enArej, "4"));
      console.log(jeNiVAreju(enArej, "A"));
      /////

      const niVAreju = (arr, del) => arr.filter((rm) => rm !== del);
      console.log(niVAreju(enArej, "a"));

      const delFromArr = (arr, del) =>
        arr
          .map((v) => (v === del ? undefined : v))
          .filter((val) => val !== undefined);
      console.log(delFromArr(enArej, "a"));
      console.log(delFromArr(enArej, "69")); ///"A", "a","d"
      console.log(delFromArr(enArej, "d")); ///"A", "a","69"
      console.log(delFromArr(enArej, ""));

      ///uporaba some()
      const arrCheck = (arr, NVal) => arr.some((val) => val === NVal);
      console.log(arrCheck(enArej, 70)); //false
      console.log(arrCheck(enArej, "69")); //true
      console.log(arrCheck(enArej, "a")); //true
      console.log(arrCheck(enArej, "A")); //true
      console.log(arrCheck(enArej, "C")); //false
      /*
            ///CONSOLE.LOGI////////////
      */

      console.log(
        "%c arrCheck(enArej,'a')",
        "color:white; background: blue; padding: 2px;",
        arrCheck(enArej, "a")
      );
      console.log(
        "%c niVAreju(enArej,'2')",
        "color: green; font-weight: bold;",
        niVAreju(enArej, "2")
      );
      console.log(
